name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/ci.db
      AUTH_SECRET: ci-auth-secret-change-me
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bun --bun playwright install --with-deps chromium

      - name: Prepare local directories
        run: mkdir -p data logs

      - name: Lint
        run: bun --bun run lint

      - name: Typecheck
        run: bun --bun run check

      - name: Test
        run: bun --bun run test

      - name: Verify database setup
        run: bun --bun run db:verify

      - name: Build
        run: bun --bun run build

      - name: Smoke
        run: bun --bun run smoke

      - name: Browser E2E
        run: bun --bun run test:e2e

      - name: Validate Docker Compose configs
        run: |
          docker compose -f docker-compose.dev.yml config
          docker compose -f docker-compose.prod.yml config
